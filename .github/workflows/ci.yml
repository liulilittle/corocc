name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: /home/runner/.cache/ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 200M
  CCACHE_BASEDIR: ${{ github.workspace }}
  # ci-summary: jobs allowed to report "skipped" (space-separated job ids).
  # Default empty = any skipped job fails the summary.
  ALLOW_SKIPPED: ""

jobs:
  native-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ninja-build ccache
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-native-gcc-${{ github.sha }}
          restore-keys: ccache-native-gcc-
      - run: bash scripts/ci/build-test.sh native-gcc

  native-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: { CC: clang, CXX: clang++ }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ninja-build ccache
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-native-clang-${{ github.sha }}
          restore-keys: ccache-native-clang-
      - run: bash scripts/ci/build-test.sh native-clang

  native-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ninja-build ccache
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-native-arm64-${{ github.sha }}
          restore-keys: ccache-native-arm64-
      - run: bash scripts/ci/build-test.sh native-arm64

  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: { ASAN_OPTIONS: detect_leaks=1 }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ninja-build
      - run: bash scripts/ci/build-test.sh asan -- -DCOROCC_ASAN=ON

  tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ninja-build
      # G0 fix: the TSan compile switch is part of the gate. The script
      # additionally asserts COROCC_TSAN:BOOL=ON in the build cache and reds
      # the job when the flag is dropped. -Wno-error=tsan: gcc 13 has no
      # instrumentation for __atomic_thread_fence and flags it under
      # -Wtsan; the project's -Werror would otherwise red the build (the
      # warning stays visible in the log). Effective flag set:
      # -fsanitize=thread -Wno-error=tsan; the sanitizer flag itself comes
      # from the COROCC_TSAN branch.
      - run: bash scripts/ci/build-test.sh tsan --select conc_runtime_tsan -- -DCOROCC_TSAN=ON -DCMAKE_C_FLAGS=-Wno-error=tsan -DCMAKE_CXX_FLAGS=-Wno-error=tsan

  nospin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ninja-build
      - run: bash scripts/ci/build-test.sh nospin -- -DCOROCC_PROBE_NOSPIN=ON

  headers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/header-conformance.sh

  boost-asio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libboost-dev clang
      # The wrappers are header-only, but the smoke spawns a coro_rt runtime,
      # so the runtime objects are built first (same recipe as the build note
      # in tests/boost/asio_smoke.cpp).
      - name: build corocc runtime objects
        run: |
          mkdir -p smoke-build
          for f in src/coroutine/*.c src/scheduler/*.c src/platform/*.c; do
            gcc -std=gnu99 -O2 -Iinclude -Isrc -c "$f" -o "smoke-build/$(basename "$f" .c).o"
          done
          gcc -c src/arch/x86_64_sysv_elf_gas.S -o smoke-build/x86_64_gas.o
      - name: smoke (g++, -std=c++11 -Wall -Wextra -Werror)
        run: g++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/boost/asio_smoke.cpp smoke-build/*.o -pthread -o smoke && ./smoke
      - name: smoke (clang++, -std=c++11 -Wall -Wextra -Werror)
        run: clang++ -std=c++11 -Wall -Wextra -Werror -Iinclude tests/boost/asio_smoke.cpp smoke-build/*.o -pthread -o smoke-clang && ./smoke-clang

  # The asio-host integration example (examples/backends/asio-host) is a
  # stand-alone CMake project: the library's default build/install does not
  # contain it. This job is the single-platform proof that the example
  # compiles and runs; the example has its own ctest set, so the library's
  # test population (45/44) is untouched. The example's Windows/MSVC run is
  # covered by local evidence (the runner image carries no Boost headers).
  asio-host-example:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libboost-dev ninja-build
      - name: configure + build the example (stand-alone project)
        run: |
          cmake -S examples/backends/asio-host -B build-asio-host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-asio-host -j2
      - name: ctest (the example's own suite)
        run: ctest --test-dir build-asio-host --output-on-failure --timeout 300

  cross:
    name: cross ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.CI_MAX_PARALLEL || '8') }}
      matrix:
        include:
          # --- apt cross-gcc + qemu-user; -static; qemu ctest gate (C-only) ---
          # Every toolchain file that names a cross CXX needs the matching g++
          # package (project() language detection runs even for the C-only
          # test set that the cross gate builds).
          - { abi: aarch64,      toolchain: scripts/toolchains/aarch64.cmake,  apt: "gcc-aarch64-linux-gnu g++-aarch64-linux-gnu", assets: "" }
          - { abi: armhf,        toolchain: scripts/toolchains/arm32.cmake,    apt: "gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf", assets: "" }
          - { abi: armel,        toolchain: scripts/toolchains/armel.cmake,    apt: "gcc-13-arm-linux-gnueabi g++-13-arm-linux-gnueabi libc6-dev-armel-cross", assets: "" }  # versioned drivers only; libc headers via libc6-dev-armel-cross (also a hard dep of libstdc++-13-dev-armel-cross; kept explicit)
          - { abi: i386,         toolchain: scripts/toolchains/i386.cmake,     apt: "libc6-dev-i386 lib32gcc-13-dev lib32stdc++-13-dev", assets: "" }          # C-only ABI: the C++ suites are gated out, but 32-bit libstdc++(.a) is needed for CMake's CXX detection link (-static)
          - { abi: mips_o32,     toolchain: scripts/toolchains/mips32.cmake,   apt: "gcc-mips-linux-gnu g++-mips-linux-gnu", assets: "" }
          - { abi: mipsel_o32,   toolchain: scripts/toolchains/mips32el.cmake, apt: "gcc-mipsel-linux-gnu g++-mipsel-linux-gnu", assets: "" }
          - { abi: mips64_n64,   toolchain: scripts/toolchains/mips64.cmake,   apt: "gcc-13-mips64-linux-gnuabi64 g++-13-mips64-linux-gnuabi64", assets: "" }      # toolchain names the versioned g++-13 driver
          - { abi: mips64el_n64, toolchain: scripts/toolchains/mips64el.cmake, apt: "gcc-13-mips64el-linux-gnuabi64 g++-13-mips64el-linux-gnuabi64", assets: "" }  # toolchain names the versioned g++-13 driver
          - { abi: ppc32,        toolchain: scripts/toolchains/ppc32.cmake,    apt: "gcc-powerpc-linux-gnu g++-powerpc-linux-gnu", assets: "" }
          - { abi: ppc64,        toolchain: scripts/toolchains/ppc64.cmake,    apt: "gcc-powerpc64-linux-gnu g++-powerpc64-linux-gnu", assets: "" }
          - { abi: ppc64le,      toolchain: scripts/toolchains/ppc64le.cmake,  apt: "gcc-powerpc64le-linux-gnu g++-powerpc64le-linux-gnu", assets: "" }
          - { abi: s390x,        toolchain: scripts/toolchains/s390x.cmake,    apt: "gcc-s390x-linux-gnu g++-s390x-linux-gnu", assets: "" }
          - { abi: riscv64,      toolchain: scripts/toolchains/riscv64.cmake,  apt: "gcc-riscv64-linux-gnu g++-riscv64-linux-gnu", assets: "" }
          - { abi: loongarch64,  toolchain: scripts/toolchains/loongarch64.cmake, apt: "gcc-13-loongarch64-linux-gnu g++-13-loongarch64-linux-gnu libc6-dev-loong64-cross", assets: "" }  # versioned drivers only; libc headers come from libc6-dev-loong64-cross (Recommends, dropped by --no-install-recommends)
          - { abi: sparc64,      toolchain: scripts/toolchains/sparc64.cmake,  apt: "gcc-13-sparc64-linux-gnu g++-13-sparc64-linux-gnu libc6-dev-sparc64-cross", assets: "" }  # versioned drivers only; libc headers from libc6-dev-sparc64-cross
          # --- prebuilt toolchain-v1 assets: fetch-toolchain-assets.sh verifies
          #     the sha256 ledger (ci/toolchain-assets.sha256) and unpacks into
          #     /opt before the build; the assets: value is the asset triple ---
          - { abi: aarch64_be, toolchain: scripts/toolchains/aarch64_be.cmake, apt: "gcc-aarch64-linux-gnu", assets: "aarch64_be-linux-gnu" }
          - { abi: armeb,      toolchain: scripts/toolchains/armeb.cmake,      apt: "gcc-arm-linux-gnueabi g++-arm-linux-gnueabi", assets: "armeb-linux-gnueabi" }
          - { abi: riscv32,    toolchain: scripts/toolchains/riscv32.cmake,    apt: "gcc-riscv64-linux-gnu g++-riscv64-linux-gnu", assets: "riscv32-linux-gnu" }
          # --- mips N32 (apt multilib route; N32 sysroot + versioned gcc-13 drivers) ---
          - { abi: mipsn32,   toolchain: scripts/toolchains/mipsn32.cmake,    apt: "gcc-13-mips64-linux-gnuabi64 g++-13-mips64-linux-gnuabi64 gcc-13-multilib-mips64-linux-gnuabi64 g++-13-multilib-mips64-linux-gnuabi64 libc6-dev-mipsn32-mips64-cross libn32stdc++-13-dev-mips64-cross", assets: "" }
          - { abi: mipsn32el, toolchain: scripts/toolchains/mipsn32el.cmake,  apt: "gcc-13-mips64el-linux-gnuabi64 g++-13-mips64el-linux-gnuabi64 gcc-13-multilib-mips64el-linux-gnuabi64 g++-13-multilib-mips64el-linux-gnuabi64 libc6-dev-mipsn32-mips64el-cross libn32stdc++-13-dev-mips64el-cross", assets: "" }
    steps:
      - uses: actions/checkout@v4
      - name: install cross toolchain + qemu-user
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ninja-build ccache qemu-user ${{ matrix.apt }}
      - name: fetch prebuilt toolchain assets
        if: matrix.assets
        run: bash scripts/ci/fetch-toolchain-assets.sh "${{ matrix.assets }}"
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-${{ matrix.abi }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.abi }}-
      - name: build + qemu ctest (C-only; cpp_perf excluded by the script)
        run: bash scripts/ci/build-test.sh "${{ matrix.abi }}" --toolchain "${{ matrix.toolchain }}"
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.abi }}
          path: ci-logs/${{ matrix.abi }}/
          retention-days: 7
          if-no-files-found: ignore

  windows-msvc:
    # First-run residue (2026-10-16, run 38768083480 job 116536439299): the
    # `windows-2025` label now resolves to the windows-2025-vs2026 image,
    # which only ships VS2026 -- the pinned `-G "Visual Studio 17 2022"`
    # generator then fails with `could not find any instance of Visual
    # Studio`. The repository's Windows evidence base is VS2022 (MSVC
    # 19.44), so this job pins `windows-2022`
    # (VS2022 17.x) to stay aligned with that evidence. VS2026 / the
    # windows-2025-vs2026 image can become a future nightly experiment
    # (default generator / newer CMake), not a gate.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: |
          cmake --build build --config Release --parallel 2
          cmake --build build --config Debug --parallel 2
      # Release-only ctest. The Debug config remains a build gate above; its
      # ctest set is disabled because three suites hang in
      # MSVC Debug (OOM injection x Debug-STL extra allocations -> uncaught
      # bad_alloc -> terminate/abort -> ucrtbased CrtDbgReportW modal dialog;
      # the death tests' abort-expecting children hit the same dialog).
      # Reproduced on earlier trees as well (not caused by the recent edits);
      # Linux Debug and Windows Release are green and cdb stacks show no
      # library defect. Debug ctest is tracked as a hardening candidate
      # (test-side robustness + abort-dialog suppression).
      - run: ctest --test-dir build -C Release --output-on-failure --timeout 300
        # NOTE: this job calls cmake/ctest directly (it does not use
        # build-test.sh). Under the VS multi-config generator CMAKE_BUILD_TYPE
        # is empty, so cpp_perf is never registered here; the script-level
        # -E cpp_perf applies to the other jobs.

  # macOS native sites (Mach-O backends vendored from Boost.Context; see
  # src/arch/x86_64_sysv_macho_gas.S and src/arch/arm64_aapcs_macho_gas.S).
  # Runner labels: the originally pinned `macos-13` was retired in Dec 2025
  # (GitHub changelog 2025-09-19); `macos-15-intel` is GitHub's designated
  # x86_64 successor -- the last Intel image, supported through Aug 2027 --
  # and `macos-15` is the current arm64 image (`macos-14` itself retires on
  # 2026-11-02, changelog 2026-10-01). This is the same runner-drift pinning
  # policy as windows-msvc below. The jobs run the full ctest population
  # (43 entries: C + C++ suites); cpp_perf stays excluded like every other
  # gated site -- the loose performance gate is a Linux-site concern and
  # macOS runners are shared.
  macos-x64:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build -E cpp_perf -j 2 --output-on-failure --timeout 300

  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build -E cpp_perf -j 2 --output-on-failure --timeout 300

  windows-x86:
    # Win32 (x86) target: the same VS2022 toolset as windows-msvc above,
    # switching to the x86 cross toolset with `-A Win32`; the resulting
    # 32-bit binaries run natively on the x64 runner through WoW64, so the
    # full Release ctest suite executes (no emulator). Backend:
    # src/arch/i386_ms.asm (Boost.Context i386 ms_pe MASM, ml.exe). The
    # runner pin and the Debug build-only / Release-ctest split follow the
    # windows-msvc job (the Debug ctest set is disabled there for the
    # CrtDbgReportW modal-dialog reason documented above).
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32
      - run: |
          cmake --build build --config Release --parallel 2
          cmake --build build --config Debug --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure --timeout 300

  ndk:
    name: ndk ${{ matrix.android_abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        android_abi: [arm64-v8a, x86_64, armeabi-v7a, x86]   # all four NDK ABIs, each with a vendored backend
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ninja-build
      - name: compile+link gate (build-only; NDK preinstalled, ANDROID_NDK is set)
        run: |
          cmake -S . -B build-ndk -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=scripts/toolchains/android-ndk.cmake \
            -DANDROID_ABI=${{ matrix.android_abi }}
          cmake --build build-ndk -j2

  # Optional, report-only: never a required check.
  perf-report:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env: { CCACHE_DIR: /home/runner/.cache/ccache, CCACHE_COMPILERCHECK: content }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ninja-build ccache
      - run: |
          cmake -S . -B build-perf -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-perf -j2
      - name: benchmarks (report-only; outputs land in ci-logs/perf/)
        run: |
          mkdir -p ci-logs/perf
          { ./build-perf/tests/bench_switch
            ./build-perf/tests/bench_switch_pure
            ./build-perf/tests/bench_rt_mn ; } 2>&1 | tee ci-logs/perf/bench-c.log
          ./build-perf/tests/bench_cpp_switch 2>&1 | tee ci-logs/perf/bench-cpp-strict.log
      - uses: actions/upload-artifact@v4
        with: { name: perf-report, path: ci-logs/perf/, if-no-files-found: ignore }

  ci-summary:
    if: always()
    needs: [native-gcc, native-clang, native-arm64, asan, tsan, nospin, headers, boost-asio, cross, windows-msvc, macos-x64, macos-arm64, windows-x86, ndk]
    # NOTE: perf-report is intentionally NOT in needs (non-required).
    runs-on: ubuntu-slim            # GA: 1 vCPU, non-privileged container, 15-min job cap (fits)
    timeout-minutes: 5
    steps:
      - name: aggregate (skipped fails unless explicitly whitelisted)
        env:
          ALLOW_SKIPPED: ${{ env.ALLOW_SKIPPED }}
          R_NATIVE_GCC: ${{ needs.native-gcc.result }}
          R_NATIVE_CLANG: ${{ needs.native-clang.result }}
          R_NATIVE_ARM64: ${{ needs.native-arm64.result }}
          R_ASAN: ${{ needs.asan.result }}
          R_TSAN: ${{ needs.tsan.result }}
          R_NOSPIN: ${{ needs.nospin.result }}
          R_HEADERS: ${{ needs.headers.result }}
          R_BOOST_ASIO: ${{ needs.boost-asio.result }}
          R_ASIO_HOST_EXAMPLE: ${{ needs.asio-host-example.result }}
          R_CROSS: ${{ needs.cross.result }}
          R_WINDOWS: ${{ needs.windows-msvc.result }}
          R_MACOS_X64: ${{ needs.macos-x64.result }}
          R_MACOS_ARM64: ${{ needs.macos-arm64.result }}
          R_WINDOWS_X86: ${{ needs.windows-x86.result }}
          R_NDK: ${{ needs.ndk.result }}
        run: |
          set -u
          fail=0
          report() { # id result
            printf '%-16s %s\n' "$1" "$2"
            case "$2" in
              success) ;;
              skipped) case " $ALLOW_SKIPPED " in *" $1 "*) ;; *) fail=1 ;; esac ;;
              *) fail=1 ;;
            esac
          }
          report native-gcc      "$R_NATIVE_GCC"
          report native-clang    "$R_NATIVE_CLANG"
          report native-arm64    "$R_NATIVE_ARM64"
          report asan            "$R_ASAN"
          report tsan            "$R_TSAN"
          report nospin          "$R_NOSPIN"
          report headers         "$R_HEADERS"
          report boost-asio      "$R_BOOST_ASIO"
          report asio-host-example "$R_ASIO_HOST_EXAMPLE"
          report cross           "$R_CROSS"
          report windows-msvc    "$R_WINDOWS"
          report macos-x64       "$R_MACOS_X64"
          report macos-arm64     "$R_MACOS_ARM64"
          report windows-x86     "$R_WINDOWS_X86"
          report ndk             "$R_NDK"
          exit "$fail"
