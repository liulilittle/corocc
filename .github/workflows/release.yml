name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:                      # rebuild/re-upload entry (verdict item 2)
    inputs:
      tag:
        description: "Existing tag to rebuild and re-upload (e.g. v0.1.0)"
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  prebuild-linux:
    name: prebuild ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.CI_MAX_PARALLEL || '8') }}
      matrix:                             # same source as the ci.yml cross matrix (ci/check-workflows.sh)
        include:
          - { abi: native-gcc,   triple: x86_64-unknown-linux-gnu, toolchain: "", apt: "", assets: "" }
          - { abi: aarch64,      triple: aarch64-unknown-linux-gnu, toolchain: scripts/toolchains/aarch64.cmake, apt: "gcc-aarch64-linux-gnu g++-aarch64-linux-gnu", assets: "" }
          - { abi: armhf,        triple: arm-linux-gnueabihf, toolchain: scripts/toolchains/arm32.cmake, apt: "gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf", assets: "" }
          - { abi: i386,         triple: i386-unknown-linux-gnu, toolchain: scripts/toolchains/i386.cmake, apt: "libc6-dev-i386 lib32gcc-13-dev lib32stdc++-13-dev", assets: "" }
          - { abi: mips_o32,     triple: mips-unknown-linux-gnu, toolchain: scripts/toolchains/mips32.cmake, apt: "gcc-mips-linux-gnu g++-mips-linux-gnu", assets: "" }
          - { abi: mipsel_o32,   triple: mipsel-unknown-linux-gnu, toolchain: scripts/toolchains/mips32el.cmake, apt: "gcc-mipsel-linux-gnu g++-mipsel-linux-gnu", assets: "" }
          - { abi: mips64_n64,   triple: mips64-unknown-linux-gnuabi64, toolchain: scripts/toolchains/mips64.cmake, apt: "gcc-13-mips64-linux-gnuabi64 g++-13-mips64-linux-gnuabi64", assets: "" }
          - { abi: mips64el_n64, triple: mips64el-unknown-linux-gnuabi64, toolchain: scripts/toolchains/mips64el.cmake, apt: "gcc-13-mips64el-linux-gnuabi64 g++-13-mips64el-linux-gnuabi64", assets: "" }
          - { abi: ppc32,        triple: powerpc-unknown-linux-gnu, toolchain: scripts/toolchains/ppc32.cmake, apt: "gcc-powerpc-linux-gnu g++-powerpc-linux-gnu", assets: "" }
          - { abi: ppc64,        triple: powerpc64-unknown-linux-gnu, toolchain: scripts/toolchains/ppc64.cmake, apt: "gcc-powerpc64-linux-gnu g++-powerpc64-linux-gnu", assets: "" }
          - { abi: ppc64le,      triple: powerpc64le-unknown-linux-gnu, toolchain: scripts/toolchains/ppc64le.cmake, apt: "gcc-powerpc64le-linux-gnu g++-powerpc64le-linux-gnu", assets: "" }
          - { abi: s390x,        triple: s390x-unknown-linux-gnu, toolchain: scripts/toolchains/s390x.cmake, apt: "gcc-s390x-linux-gnu g++-s390x-linux-gnu", assets: "" }
          - { abi: riscv64,      triple: riscv64-unknown-linux-gnu, toolchain: scripts/toolchains/riscv64.cmake, apt: "gcc-riscv64-linux-gnu g++-riscv64-linux-gnu", assets: "" }
          # --- prebuilt toolchain-v1 release assets: sha256-verified fetch into
          #     /opt before the build (assets: = asset triple) ---
          - { abi: aarch64_be, triple: aarch64_be-unknown-linux-gnu, toolchain: scripts/toolchains/aarch64_be.cmake, apt: "gcc-aarch64-linux-gnu", assets: "aarch64_be-linux-gnu" }
          - { abi: armeb,      triple: armeb-unknown-linux-gnueabi, toolchain: scripts/toolchains/armeb.cmake, apt: "gcc-arm-linux-gnueabi g++-arm-linux-gnueabi", assets: "armeb-linux-gnueabi" }
          - { abi: riscv32,    triple: riscv32-unknown-linux-gnu, toolchain: scripts/toolchains/riscv32.cmake, apt: "gcc-riscv64-linux-gnu g++-riscv64-linux-gnu", assets: "riscv32-linux-gnu" }
          # - { abi: mips_n32,   triple: mipsisa32r6el-unknown-linux-gnu, toolchain: scripts/toolchains/mipsn32.cmake, apt: "gcc-13-multilib-mips64-linux-gnuabi64 libc6-dev-mipsn32-mips64-cross libn32atomic1-mips64-cross" }   # enable after W6
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ninja-build ccache qemu-user ${{ matrix.apt }}
      - if: matrix.assets
        run: bash scripts/ci/fetch-toolchain-assets.sh "${{ matrix.assets }}"
      - name: build + qemu ctest gate
        env: { TOOLCHAIN: "${{ matrix.toolchain }}" }
        run: |
          extra=()
          if [ -n "$TOOLCHAIN" ]; then extra+=(--toolchain "$TOOLCHAIN"); fi   # L2: empty toolchain is not passed
          bash scripts/ci/build-test.sh "${{ matrix.abi }}" "${extra[@]}"
      - name: stage dist
        run: bash scripts/ci/stage-dist.sh "${{ matrix.abi }}" "${{ matrix.triple }}" "${{ inputs.tag || github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.triple }}
          path: dist-out/corocc-${{ inputs.tag || github.ref_name }}-${{ matrix.triple }}.tar.gz   # G3: same naming chain as stage-dist.sh
          if-no-files-found: error

  prebuild-windows:
    # Same runner-drift anchor as ci.yml (first-run residue 2026-10-16, run
    # 38768083480 job 116536439299): the `windows-2025` label now resolves to
    # the windows-2025-vs2026 image (VS2026 only), which cannot serve the
    # pinned `-G "Visual Studio 17 2022"` generator. The repository's Windows
    # evidence base is VS2022 (M9 MSVC 19.44, A-2 fix verification 17.14), so
    # this job pins `windows-2022` to stay aligned with that evidence.
    # VS2026 / the windows-2025-vs2026 image can become a future nightly
    # experiment, not a gate.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure --timeout 300
      - shell: bash
        run: bash scripts/ci/stage-dist-win.sh "${{ inputs.tag || github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist-out/corocc-${{ inputs.tag || github.ref_name }}-x86_64-pc-windows-msvc.zip   # G3: same naming chain
          if-no-files-found: error

  publish:
    needs: [prebuild-linux, prebuild-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      # G2 fix: flat BASENAMES only (consumers run `sha256sum -c` on the flat
      # release assets); no cd; explicit globstar; duplicate-name guard;
      # sort + cat witness.
      - name: checksums (flat basenames, workspace root)
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*.tar.gz artifacts/**/*.zip)
          ((${#files[@]} > 0)) || { echo "no artifacts"; exit 1; }
          : > SHA256SUMS
          for f in "${files[@]}"; do
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" ) >> SHA256SUMS
          done
          dup="$(awk '{print $2}' SHA256SUMS | sort | uniq -d)"
          if [ -n "$dup" ]; then echo "duplicate asset names: $dup"; exit 1; fi
          sort -k2 SHA256SUMS -o SHA256SUMS
          cat SHA256SUMS
      - name: publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          shopt -s globstar nullglob
          tag="${{ inputs.tag || github.ref_name }}"
          assets=(artifacts/**/*.tar.gz artifacts/**/*.zip)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" SHA256SUMS --clobber
          else
            gh release create "$tag" --title "corocc $tag" --generate-notes "${assets[@]}" SHA256SUMS
          fi
          gh release view "$tag" --json assets --jq '.assets[].name'
